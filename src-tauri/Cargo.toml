[package]
name = "awusic-meta"
version = "0.1.0"
description = "AWuse — High-precision lossless audio metadata batch workstation & media library organizer"
authors = ["AWuse"]
edition = "2021"

[lib]
name = "awusic_meta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.21"
rusqlite = { version = "0.32", features = ["bundled"] }
rayon = "1.10"
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
pinyin = "0.10"
regex = "1.11"
encoding_rs = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
symphonia = { version = "0.5", features = ["flac", "aac", "alac", "mp3", "pcm", "ogg"] }
md-5 = "0.10"
